name: Feature request
description: Suggest a new command, setting, or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or the workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. Mention the Raycast equivalent if there is one.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
