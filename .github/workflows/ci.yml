name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer merge must not cancel the CI run that gates an older merge's release.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: TypeScript (typecheck, test, build)
    # A public repository runs on free GitHub-hosted runners, so fork pull requests never
    # reach the self-hosted VMs. Only the private repository uses the owner's local Mac.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","opencast-ci"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release script syntax
        run: |
          for script in scripts/build-app.sh scripts/build-dmg.sh scripts/verify-dmg.sh scripts/release-macos.sh scripts/sign-macos-update.sh scripts/make-icon.sh scripts/prepare-release-node.sh scripts/verify-node.sh scripts/typecheck-release.sh scripts/deploy-sync.sh; do
            bash -n "$script"
          done
      - name: Check release provenance and retries
        run: node --test scripts/release-macos.test.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  macos:
    name: macOS app (Swift build)
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64","opencast-ci"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native host
        run: swift build -c release --package-path apps/macos
