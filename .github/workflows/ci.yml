name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer merge must not cancel the CI run that gates an older merge's release.
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release script syntax
        run: |
          for script in scripts/build-app.sh scripts/build-dmg.sh scripts/verify-dmg.sh scripts/release-macos.sh scripts/make-icon.sh scripts/prepare-release-node.sh scripts/verify-node.sh; do
            bash -n "$script"
          done
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  macos:
    name: macOS app (Swift build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native host
        run: swift build -c release --package-path apps/macos
