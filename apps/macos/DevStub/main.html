<!doctype html>
<html><head><meta charset="utf-8"><title>Surgecast Native Dev Stub</title>
<style>
:root { color-scheme: dark light; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
body { margin: 0; padding: 24px; background: transparent; }
input { box-sizing: border-box; width: 100%; padding: 14px; font-size: 20px; border: 1px solid #8885; border-radius: 10px; background: #8882; }
button { padding: 8px 12px; margin: 4px; } pre { white-space: pre-wrap; font-size: 11px; max-height: 160px; overflow: auto; }
</style></head><body>
<input autofocus placeholder="Search Surgecast…" aria-label="Search">
<p>Native macOS host development page</p>
<div><button data-method="window.setContentHeight" data-params='{"height":620,"animate":true}'>Expand</button>
<button data-method="window.setContentHeight" data-params='{"height":475,"animate":true}'>Collapse</button>
<button data-method="window.hide" data-params='{"restoreFocus":true}'>Hide</button>
<button data-method="hud.show" data-params='{"text":"Native bridge works","icon":"checkmark.circle"}'>HUD</button>
<button data-method="confetti.show">Confetti</button><button data-method="apps.list">Applications</button></div>
<pre id="config"></pre><pre id="result" aria-live="polite"></pre>
<script>
const call = (method, params = {}) => window.webkit.messageHandlers.native.postMessage({method, params});
document.querySelector('#config').textContent = JSON.stringify({...window.__SURGECAST__, token: '<redacted>'}, null, 2);
for (const button of document.querySelectorAll('button')) button.onclick = async () => document.querySelector('#result').textContent = JSON.stringify(await call(button.dataset.method, JSON.parse(button.dataset.params || '{}')), null, 2);
document.addEventListener('keydown', event => { if (event.key === 'Escape') call('window.hide', {restoreFocus:true}); });
window.__surgecastNative.on('window.route', payload => document.querySelector('#result').textContent = JSON.stringify(payload, null, 2));
(async () => {
  const info = await call('app.info');
  const screens = await call('windows.screens');
  const unknown = await call('not.a.method');
  const height = await call('window.setContentHeight', {height:475});
  const iconOK = await new Promise(resolve => { const icon = new Image(); icon.onload = () => resolve(icon.naturalWidth === 32); icon.onerror = () => resolve(false); icon.src = 'surgecast-icon://file?path=' + encodeURIComponent('/System/Library/CoreServices/Finder.app') + '&size=32'; });
  const report = {appVersion:info.result?.version, screens:screens.result?.length, unknownCode:unknown.error?.code, heightOK:'result' in height, iconOK, backendPort:new URL(window.__SURGECAST__.backendUrl).port, macos:document.documentElement.getAttribute('macos'), appearance:document.documentElement.hasAttribute('dark') ? 'dark' : 'light', window:window.__SURGECAST__.window};
  const socket = new WebSocket(`${window.__SURGECAST__.backendUrl}?token=${encodeURIComponent(window.__SURGECAST__.token)}&window=main`);
  socket.onopen = () => socket.send(JSON.stringify({jsonrpc:'2.0',method:'dev.report',params:report}));
  document.querySelector('#result').textContent = JSON.stringify(report, null, 2);
})();
</script></body></html>
